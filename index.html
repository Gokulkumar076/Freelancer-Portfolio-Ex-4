<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freelance Portfolio - Authentication</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Section -->
    <header>
        <div class="logo-container">
            <img src="https://cdn-icons-png.flaticon.com/512/415/415733.png" alt="Logo" class="logo">
        </div>
        <nav>
            <ul>
                <li class="active"><a href="#">Home</a>
                    <ul class="dropdown">
                        <li class="dropdown-header">Favourite</li>
                        <li><a href="#">Item 1 <img src="https://cdn-icons-png.flaticon.com/512/415/415733.png" class="drop-icon"></a></li>
                        <li><a href="#">Item 2</a></li>
                        <li><a href="#">Item 3</a></li>
                        <li><a href="#">Item 4</a></li>
                    </ul>
                </li>
                <li><a href="#">About</a></li>
                <li><a href="#">Myself</a></li>
                <li><a href="#">Others</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Container: Sign In & Sign Up Forms -->
    <section class="container">
        <!-- Sign In Box -->
        <div class="box">
            <h2>Sign In</h2>
            <form action="#">
                <label for="signin-user">Username</label>
                <input type="text" id="signin-user" placeholder="Enter Username / Email / Phone Number">

                <label for="signin-pass">Password</label>
                <input type="password" id="signin-pass" placeholder="Enter Password">

                <input type="submit" value="Sign In">
            </form>
        </div>

        <!-- Sign Up Box -->
        <div class="box">
            <h2>Sign Up</h2>
            <form action="#">
                <label for="signup-name">Name</label>
                <input type="text" id="signup-name" placeholder="Enter Name">

                <label for="signup-email">Email</label>
                <input type="email" id="signup-email" placeholder="Enter Email">

                <label for="signup-pass">Password</label>
                <input type="password" id="signup-pass" placeholder="Enter Password">

                <input type="submit" value="Sign Up">
            </form>
        </div>
    </section>

    <!-- Footer Section -->
    <footer>
        <p><strong>Your address</strong></p>
        <p>© 2026-2027. (Register number) - Web Technology Lab Batch 1. All Rights Reserved.</p>
    </footer>

</body>
</html>
